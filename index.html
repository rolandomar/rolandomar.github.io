<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eleições FCUP 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/site.css?v=5">
  <style>
    .pick { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 36px; }
    .pick a { display: block; background: var(--card); border-radius: 20px; padding: 32px; text-decoration: none; box-shadow: var(--shadow); border-top: 6px solid var(--c); transition: transform .15s; }
    .pick a:hover { transform: translateY(-3px); }
    .pick h2 { font-family: "Fraunces", Georgia, serif; margin: 8px 0; font-size: 28px; }
    .pick p { margin: 0; color: var(--muted); }
  </style>
</head>
<body>
  <main class="hero"><div class="wrap">
    <p class="eyebrow">Faculdade de Ciências · Universidade do Porto · 2026</p>
    <h1>Eleições <em>FCUP</em></h1>
    <div class="pick">
      <a href="cientifico/" style="--c:#1f6f8b"><p class="eyebrow" style="margin:0">Lista B</p><h2>Conselho Científico</h2><p>Candidatos, manifesto e informação eleitoral →</p></a>
      <a href="representantes/" style="--c:#c8553d"><p class="eyebrow" style="margin:0">Lista B</p><h2>Conselho de Representantes</h2><p>Candidatos, manifesto e informação eleitoral →</p></a>
    </div>
  </div></main>
</body>
</html>
